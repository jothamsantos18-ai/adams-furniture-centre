<form action="https://formspree.io/f/mjyypwqd" method="POST">

<table class="form-table">

<tr>
    <td><strong>NAME:</strong></td>
    <td>
        <input class="form-input"
               name="name"
               type="text"
               placeholder="Enter your full name"
               required="required" />
    </td>
</tr>

<tr>
    <td><strong>GENDER:</strong></td>
    <td>
        <input name="gender" value="MALE" type="radio" required="required" />
        MALE

        &nbsp;&nbsp;

        <input name="gender" value="FEMALE" type="radio" />
        FEMALE
    </td>
</tr>

<tr>
    <td><strong>KIND OF FURNITURE:</strong></td>
    <td>
        <select name="furniture" class="form-select" required="required">
            <option value="">CHOOSE ANY KIND OF FURNITURE YOU WANT TO BUY</option>
            <option value="DINNING TABLES">DINNING TABLES</option>
            <option value="CLASSIC BEDS">CLASSIC BEDS</option>
            <option value="CLASSIC DESKS">CLASSIC DESKS</option>
            <option value="CLASSIC OFFICE FURNITURE">CLASSIC OFFICE FURNITURE</option>
            <option value="CUP BOARDS">CUP BOARDS</option>
        </select>
    </td>
</tr>

<tr>
    <td><strong>DATE OF PICKUP:</strong></td>
    <td>
        <input name="pickup_date"
               class="form-input"
               type="date"
               required="required" />
    </td>
</tr>

<tr>
    <td><strong>RESIDENCE:</strong></td>
    <td>
        <input name="residence"
               class="form-input"
               type="text"
               placeholder="Enter your residence"
               required="required" />
    </td>
</tr>

<tr>
    <td><strong>ADDITIONAL MESSAGE:</strong></td>
    <td>
        <textarea name="message"
                  style="width:90%; height:100px; font-size:16px;"
                  placeholder="Enter any additional information about your order"></textarea>
    </td>
</tr>

<tr>
    <td></td>
    <td>
        <input class="button"
               type="submit"
               value="SEND ORDER" />

        &nbsp;&nbsp;&nbsp;

        <input class="button"
               type="reset"
               value="CANCEL" />
    </td>
</tr>

</table>

</form>
